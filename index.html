<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper">
        <div class="app-row">
            <div class="app-window">
                <button id="clickBtn" class="btn-action">Click :3</button>
                <button id="wkBtn" class="btn-action">Wake up :3</button>
                <button id="ilyBtn" class="btn-action">I love you</button>
            </div>
        </div>
        <div id="statusLbl" class="lbl-status"></div>
    </div>

    <script>
        const LISTENER_URL = "https://unfancied-siegeable-jude.ngrok-free.dev/click";
        const AUTO_REMOTE_URL = "https://autoremotejoaomgcd.appspot.com/sendmessage";

        const PAYLOAD_DATA = {
            "key": "c9f-IOZniHs:APA91bFBIX-ehMJ8PC3F_g1wAYrL6yRl_YlwWcmcsBArZ0VSxa9PBzP2WoPXgaE22cXCX-na-gwNMEb3zUdsVRNrtuu4sBdNfFQwP7h5Fm_n40FJIRuBFn4",
            "message": "ck",
            "password": "clicker"
        };

        const btn = document.getElementById('clickBtn');
        const wkBtn = document.getElementById('wkBtn');
        const ilyBtn = document.getElementById('ilyBtn');
        const statusLbl = document.getElementById('statusLbl');

        const sendAutoRemote = async (message) => {
            const params = new URLSearchParams(PAYLOAD_DATA);
            params.set('message', message);
            params.append('_t', Date.now());

            return fetch(`${AUTO_REMOTE_URL}?${params.toString()}`, {
                method: 'GET',
                mode: 'no-cors'
            }).catch(e => console.warn('AR Fail:', e));
        };

        btn.addEventListener('click', async () => {
            btn.innerText = 'Sending...';
            btn.setAttribute('disabled', 'true');
            statusLbl.innerText = 'Clicking...';

            const timestamp = Date.now();

            const arParams = new URLSearchParams(PAYLOAD_DATA);
            arParams.append('_t', timestamp);

            const reqAutoRemote = fetch(`${AUTO_REMOTE_URL}?${arParams.toString()}`, {
                method: 'GET',
                mode: 'no-cors'
            }).catch(e => console.warn('AR Fail:', e));

            const ngrokUrl = new URL(LISTENER_URL);
            Object.keys(PAYLOAD_DATA).forEach(key => ngrokUrl.searchParams.append(key, PAYLOAD_DATA[key]));
            ngrokUrl.searchParams.append('_t', timestamp);

            const reqNgrok = fetch(ngrokUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: arParams
            }).catch(e => console.warn('Ngrok Fail:', e));

            await Promise.all([reqAutoRemote, reqNgrok]);

            setTimeout(() => {
                btn.innerText = 'Click :3';
                btn.removeAttribute('disabled');
                statusLbl.innerText = 'Clicked!';
                console.log('Requests sent.');
            }, 300);
        });

        wkBtn.addEventListener('click', async () => {
            wkBtn.innerText = 'Sending...';
            wkBtn.setAttribute('disabled', 'true');
            statusLbl.innerText = 'Sending wake up signal...';

            await sendAutoRemote('wk');

            setTimeout(() => {
                wkBtn.innerText = 'Wake up :3';
                wkBtn.removeAttribute('disabled');
                statusLbl.innerText = 'Sent wake up signal!';
                console.log('WK request sent.');
            }, 300);
        });

        ilyBtn.addEventListener('click', async () => {
            ilyBtn.innerText = 'Sending...';
            ilyBtn.setAttribute('disabled', 'true');
            statusLbl.innerText = 'Sending I love you...';

            await sendAutoRemote('ly');

            setTimeout(() => {
                ilyBtn.innerText = 'I love you';
                ilyBtn.removeAttribute('disabled');
                statusLbl.innerText = 'Sent I love you!';
                console.log('ILY request sent.');
            }, 300);
        });
    </script>
</body>
</html>
